<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Three attention patterns</title>
  <desc id="desc">An encoder permits all four tokens to attend to all four tokens. A causal decoder permits only current and earlier positions, making a lower triangular mask. Cross-attention has three decoder query rows and four encoder key columns. Blue cells are allowed, grey cells are blocked; these are masks, not measured weights.</desc>
  <defs><pattern id="full" width="42" height="42" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="38" height="38" rx="5" fill="#4388ca"/></pattern></defs>
  <rect width="960" height="540" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b46">
    <text x="32" y="48" font-size="29" font-weight="700">Who is allowed to read whom?</text>
    <text x="32" y="80" font-size="20" fill="#52647a">Read each matrix row as one query; columns are the available keys.</text>
    <g fill="#fff" stroke="#d5dfeb"><rect x="24" y="110" width="296" height="330" rx="16"/><rect x="332" y="110" width="296" height="330" rx="16"/><rect x="640" y="110" width="296" height="330" rx="16"/></g>
    <text x="172" y="148" text-anchor="middle" font-size="23" font-weight="700">Encoder self-attention</text>
    <text x="480" y="148" text-anchor="middle" font-size="23" font-weight="700">Causal self-attention</text>
    <text x="788" y="148" text-anchor="middle" font-size="23" font-weight="700">Cross-attention</text>
    <text x="172" y="183" text-anchor="middle" font-size="19">4 input keys</text>
    <text x="480" y="183" text-anchor="middle" font-size="19">4 prefix keys</text>
    <text x="788" y="183" text-anchor="middle" font-size="19">4 encoder keys</text>
    <g transform="translate(88 204)"><rect width="168" height="168" fill="url(#full)"/></g>
    <g transform="translate(396 204)">
      <g fill="#4388ca"><rect x="2" y="2" width="38" height="38" rx="5"/><rect x="2" y="44" width="38" height="38" rx="5"/><rect x="44" y="44" width="38" height="38" rx="5"/><rect x="2" y="86" width="38" height="38" rx="5"/><rect x="44" y="86" width="38" height="38" rx="5"/><rect x="86" y="86" width="38" height="38" rx="5"/><rect x="2" y="128" width="38" height="38" rx="5"/><rect x="44" y="128" width="38" height="38" rx="5"/><rect x="86" y="128" width="38" height="38" rx="5"/><rect x="128" y="128" width="38" height="38" rx="5"/></g>
      <g fill="#e4e9f0"><rect x="44" y="2" width="38" height="38" rx="5"/><rect x="86" y="2" width="38" height="38" rx="5"/><rect x="128" y="2" width="38" height="38" rx="5"/><rect x="86" y="44" width="38" height="38" rx="5"/><rect x="128" y="44" width="38" height="38" rx="5"/><rect x="128" y="86" width="38" height="38" rx="5"/></g>
      <g font-size="25" text-anchor="middle" fill="#6d7889"><text x="63" y="30">×</text><text x="105" y="30">×</text><text x="147" y="30">×</text><text x="105" y="72">×</text><text x="147" y="72">×</text><text x="147" y="114">×</text></g>
    </g>
    <g transform="translate(704 204)"><rect width="168" height="126" fill="url(#full)"/></g>
    <text x="68" y="288" transform="rotate(-90 68 288)" text-anchor="middle" font-size="18">4 input queries</text>
    <text x="376" y="288" transform="rotate(-90 376 288)" text-anchor="middle" font-size="18">4 prefix queries</text>
    <text x="684" y="267" transform="rotate(-90 684 267)" text-anchor="middle" font-size="18">3 decoder queries</text>
    <text x="172" y="412" text-anchor="middle" font-size="19">Read both directions</text>
    <text x="480" y="412" text-anchor="middle" font-size="19">Never read future tokens</text>
    <text x="788" y="370" text-anchor="middle" font-size="19">Read a different sequence</text>
    <text x="788" y="399" text-anchor="middle" font-size="18" fill="#52647a">Rows and columns can differ</text>
    <rect x="40" y="470" width="20" height="20" rx="4" fill="#4388ca"/><text x="70" y="487" font-size="20">Allowed</text>
    <rect x="196" y="470" width="20" height="20" rx="4" fill="#e4e9f0"/><text x="226" y="487" font-size="20">Blocked</text>
    <text x="40" y="519" font-size="18" fill="#52647a">These show connectivity, not attention strength. Padding keys are excluded in all three patterns.</text>
  </g>
</svg>
